name: cd

on:
  workflow_dispatch:
    inputs:
      validate_only:
        required: false
        type: boolean
        description: |
          Run the build/test/package steps only, skip the Cloudsmith deploy
        default: true

# Deliberately manual-only (no push trigger): publishing to Cloudsmith is a release action,
# not something that should happen automatically on every commit. There is no reusable
# jenkins-infra workflow this repo can call into -- their maven-cd.yml is hardcoded to
# repo.jenkins-ci.org/releases with bearer-token auth, not Cloudsmith's username/password
# server auth -- so this is a small workflow of our own.

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-stepsecurity-x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # No -s settings.xml / CLOUDSMITH_API_KEY here: ci.yml already proves the build+test step
      # resolves fine from Central/repo.jenkins-ci.org without the Cloudsmith mirror. Keeping the
      # credential scoped to only the deploy step below (not live for the entire build+test run,
      # which compiles and executes a large amount of third-party plugin code) shrinks its
      # exposure window to just the one command that actually needs it.
      - name: Build and test
        run: ./mvnw -B -ntp clean verify

      - name: Deploy to Cloudsmith
        if: ${{ inputs.validate_only != true }}
        run: ./mvnw -B -ntp -s settings.xml -Dmaven.deploy.skip=false deploy -DskipTests
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
