name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-stepsecurity-x64
    strategy:
      fail-fast: false
      matrix:
        java: [21, 25]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp -Dstyle.color=always -Penable-jacoco clean verify

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: jacoco-report-jdk${{ matrix.java }}
          path: target/site/jacoco/
          if-no-files-found: ignore
